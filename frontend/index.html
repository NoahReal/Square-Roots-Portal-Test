<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" type="image/png" href="/square-roots-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Noto+Serif:wght@700&family=Playfair+Display:wght@400;700&display=swap"
    />
    <title>Square Roots</title>

    <meta name="description" content="Square Roots is a student-run community interest company in Nova Scotia selling seconds produce from local farms, pay what works for you." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Square Roots" />
    <meta property="og:title" content="Square Roots" />
    <meta property="og:description" content="Fresh Nova Scotia seconds produce, pay what works for you. Reserve a bundle online." />
    <meta property="og:image" content="/photos/brussels-sprouts.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
